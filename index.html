<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="apple-touch-icon" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100次挑戰紀錄</title>
    <style>
        :root { --p-red: #FF4136; --p-yellow: #FFDC00; --bg: #F8F4F0; --black: #000; --soft-blue: #0074D9; --gray: #bbb; --gray-light: #eee; }
        body { background: var(--bg); color: #333; font-family: "PingFang TC", sans-serif; margin: 0; padding-top: 50px; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .header { background: var(--black); color: white; position: fixed; top: 0; width: 100%; z-index: 100; border-bottom: 3px solid var(--p-red); }
        .nav-top { display: flex; height: 50px; }
        .nav-item { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; color: #666; cursor: pointer; }
        .nav-item.active { color: var(--p-yellow); background: rgba(255,255,255,0.1); }
        .tab-content { display: none; padding: 20px; width: 100%; max-width: 500px; margin: 0 auto; box-sizing: border-box; }
        .tab-content.active { display: flex; flex-direction: column; min-height: calc(100vh - 50px); }
        .game-card, .bonus-card { background: white; border: 2px solid var(--black); padding: 18px; margin-bottom: 12px; display: flex; align-items: center; cursor: pointer; }
        .game-card.done { border-color: #ccc; color: #bbb; opacity: 0.6; }
        .check-box { width: 28px; height: 28px; border: 2px solid var(--black); margin-right: 12px; display: flex; align-items: center; justify-content: center; background: #fff; flex-shrink: 0; }
        .game-card.done .check-box::after { content: '✔'; color: var(--p-red); font-size: 24px; font-weight: bold; }
        .bonus-card { background: transparent; border: 1px solid #ddd; color: #bbb; margin-top: 20px; display: none !important; }
        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; background: white; padding: 20px; border: 3px solid var(--black); width: 100%; box-sizing: border-box; }
        .cell { aspect-ratio: 1/1; border: 1px solid #eee; background: #f9f9f9; font-size: 10px; display: flex; align-items: center; justify-content: center; color: #ddd; font-family: "Impact", sans-serif; }
        .cell.filled { background: var(--p-red); color: white; border-color: var(--black); }
        .cell.gold-filled { background: var(--p-yellow); color: var(--black); border-color: var(--black); font-weight: bold; }
        .milestone-report { margin-bottom: 20px; padding: 20px; border: 3px solid var(--black); background: #fff; position: relative; text-align: left; }
        .milestone-tag { position: absolute; top: -12px; left: 10px; color: #fff; padding: 2px 8px; font-size: 10px; font-weight: bold; }
        .color-stat { color: #000; background: var(--p-yellow); padding: 0 4px; font-weight: 900; }
        #final-reveal-btn { display: none; width: 100%; padding: 16px; background: var(--black); color: #fff; border: none; font-size: 16px; font-weight: bold; margin-bottom: 20px; cursor: pointer; box-shadow: 4px 4px 0 var(--p-red); }
        
        /* 數據管理樣式 */
        .data-management-box { margin-top: 50px; border-top: 1px solid #eee; padding-top: 20px; }
        .fix-btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .fix-btn { flex: 1; padding: 8px; border: 1px solid var(--gray-light); background: #fff; font-size: 11px; color: #999; border-radius: 4px; cursor: pointer; }
        .json-action-btn { flex: 1; padding: 10px; border: 1px solid var(--gray-light); background: #fff; color: #999; font-size: 11px; border-radius: 4px; cursor: pointer; }
        #restore-zone { display: none; margin-top: 15px; text-align: left; }
        #memoInput { width: 100%; height: 80px; font-size: 10px; border: 1px solid var(--gray-light); background: #fff; padding: 10px; box-sizing: border-box; border-radius: 4px; margin-top: 10px; }

        /* 證書樣式 */
        #cert-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        #cert-box { width: 100%; max-width: 350px; background: #FAF5F0; color: #000; padding: 45px 30px; text-align: left; position: relative; border: 1px solid #ddd; opacity: 0; transition: 0.5s; }
        .final-amount-val { font-size: 32px; font-weight: 900; color: var(--p-red); font-family: "Impact", sans-serif; }
        .color-date { color: var(--p-red); font-weight: bold; }
        .color-ques { color: var(--soft-blue); font-style: italic; }
        
        /* 備份對帳單視窗 */
        #backup-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; justify-content:center; align-items:center; padding:20px; box-sizing:border-box; }
    </style>
</head>
<body onload="initGame()">

    <header class="header">
        <nav class="nav-top">
            <div class="nav-item active" onclick="switchTab('play', this)">任務</div>
            <div class="nav-item" onclick="switchTab('map', this)">紀錄</div>
        </nav>
    </header>

    <div id="tab-play" class="tab-content active">
        <div id="task-meal" class="game-card" onclick="processTask('task-meal')"><div class="check-box"></div><div><b>飽足的一餐</b><br><small>原型食物</small></div></div>
        <div id="task-drink" class="game-card" onclick="processTask('task-drink')"><div class="check-box"></div><div><b>純粹的飲用</b><br><small>無糖飲品</small></div></div>
        <div id="task-bonus" class="bonus-card" style="display:none;"><span class="bonus-star">★</span><div><b>特殊成就</b><br><small>身體動動</small></div></div>
        <div id="day-status" style="text-align:center; font-size:12px; color:#aaa; margin-top:25px; flex-grow: 1;">今日任務尚未完成</div>
        <div style="text-align:center; font-size:11px; color:var(--p-red); margin-bottom:10px; font-weight:bold;">
            LAST RECORDED: <span id="last-time">---</span>
        </div>
    </div>

    <div id="tab-map" class="tab-content">
        <div id="milestone-area"></div>
        <button id="final-reveal-btn" onclick="openCertificate()">查看結業證明</button>
        <div class="grid" id="map-grid"></div>
        <p style="text-align:center; font-size:12px; color:#888; margin-top:30px; font-weight:bold;">已累積 <span id="display-count" style="color:var(--p-red); font-size:20px;">0</span> / 100 次冒險</p>
        
        <div class="data-management-box">
            <div class="fix-btn-group">
                <button class="fix-btn" onclick="applyCorrection('A')">ERASE</button>
                <button class="fix-btn" onclick="applyCorrection('B')">EDIT</button>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="json-action-btn" onclick="exportData()">生成對帳單</button>
                <button class="json-action-btn" onclick="exportJSON()">導出 JSON 數據</button>
                <button class="json-action-btn" onclick="toggleRestoreZone()">數據還原</button>
            </div>
            <div id="restore-zone">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:10px; color:var(--gray); font-weight:bold;">貼上 JSON 數據</span>
                    <button class="json-action-btn" style="flex:none; padding:3px 10px; background:#000; color:#fff;" onclick="importJSON()">確認還原</button>
                </div>
                <textarea id="memoInput" placeholder='請在此處貼上 JSON 代碼...'></textarea>
            </div>
        </div>
    
        <div style="text-align:center; font-size:10px; color:#ccc; margin: 40px 0 20px 0; letter-spacing:1px;">
            VER / UPDATED: 2026-07-18 (修正建議 B 4:6:10 版)
        </div>
    </div>

    <div id="cert-overlay">
        <div id="cert-box">
            <div style="font-size:10px; letter-spacing:4px; color:#aaa; margin-bottom:25px; border-bottom:1px solid #eee; padding-bottom:10px;">OFFICIAL RECORD / 2026</div>
            <div id="dynamic-text" style="font-size:14px; line-height:2; color:#333; margin-bottom:25px;"></div>
            <div style="margin-top:30px; padding-top:20px; border-top:1px solid #000;">
                <div style="font-size:13px; color:#666; margin-bottom:8px; display:flex; justify-content:space-between;"><span>基礎積分獎金</span><span>NT$ <span id="res-base">0</span></span></div>
                <div style="font-size:13px; color:#666; margin-bottom:8px; display:flex; justify-content:space-between;"><span>提速達成獎勵</span><span>NT$ <span id="res-bonus">0</span></span></div>
                <div style="margin-top:30px; text-align:right;">
                    <div style="font-size:10px; color:#888;">應得總額</div>
                    <div class="final-amount-val">NT$ <span id="res-total">0</span></div>
                </div>
            </div>
            <button onclick="resetGame()" style="margin-top:40px; background:none; border:none; color:#bbb; text-decoration:underline; font-size:10px; cursor:pointer; padding:0;">RESET ALL DATA</button>
            <button onclick="document.getElementById('cert-overlay').style.display='none'" style="margin-left:20px; background:none; border:none; color:#bbb; text-decoration:underline; font-size:10px; cursor:pointer;">CLOSE</button>
        </div>
    </div>

    <div id="backup-overlay">
        <div style="background:white; width:100%; max-width:400px; padding:20px; border-radius:10px; text-align:center;">
            <h3>📋 進度對帳單</h3>
            <textarea id="backup-text" readonly onclick="this.select()" style="width:100%; height:180px; border:1px solid #ddd; padding:10px; box-sizing:border-box; font-size:14px; line-height:1.6; margin-bottom:15px;"></textarea>
            <button onclick="document.getElementById('backup-overlay').style.display='none'" style="width:100%; padding:15px; background:var(--black); color:white; border:none; border-radius:5px; font-weight:bold;">關閉</button>
        </div>
    </div>

    <script>
        let totalExp = 0, baseCount = 0, mealTotal = 0, drinkTotal = 0, bonusCount = 0;
        let todayMarked = false, hasBonusToday = false;
        const startDate = new Date('2026-03-31'), deadline = new Date('2026-08-31');

        function initGame() {
            initGrid();
            const saved = localStorage.getItem('c100_state');
            if(saved) {
                const d = JSON.parse(saved);
                totalExp = d.totalExp; baseCount = d.baseCount; 
                mealTotal = d.mealTotal || 0; drinkTotal = d.drinkTotal || 0; bonusCount = d.bonusCount || 0;
                const isNewDay = d.lastDate !== new Date().toDateString();
                todayMarked = isNewDay ? false : (d.todayMarked || false);
                hasBonusToday = isNewDay ? false : (d.hasBonusToday || false);
                
                if(d.saveTimestamp) {
                    document.getElementById('last-time').innerText = d.saveTimestamp;
                }

                if(!isNewDay) {
                    if(d.mealDone) document.getElementById('task-meal').classList.add('done');
                    if(d.drinkDone) document.getElementById('task-drink').classList.add('done');
                }
                if(d.cellClasses) d.cellClasses.forEach((cls, i) => { 
                    if(document.getElementById('c'+(i+1))) document.getElementById('c'+(i+1)).className = cls; 
                });
            }
            updateUI();
        }

        function initGrid() {
            const grid = document.getElementById('map-grid'); grid.innerHTML = '';
            for(let i=1; i<=100; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell'; cell.id = 'c'+i; cell.innerText = i;
                grid.appendChild(cell);
            }
        }

        function updateUI() {
            document.getElementById('display-count').innerText = baseCount;
            document.getElementById('day-status').innerText = todayMarked ? "今日冒險已收錄！" : "今日任務尚未完成";
            for(let i=1; i<=100; i++) {
                const cell = document.getElementById('c' + i);
                if(i <= baseCount) {
                    if(!cell.classList.contains('filled') && !cell.classList.contains('gold-filled')) cell.classList.add('filled');
                } else { cell.className = 'cell'; }
            }
            
            const mileArea = document.getElementById('milestone-area');
            mileArea.innerHTML = "";
            if (baseCount === 33) {
                mileArea.innerHTML = `<div class="milestone-report"><div class="milestone-tag" style="background:var(--p-red);">MILESTONE 33</div><p style="margin:0; font-size:15px; line-height:1.8; color:#000;"><b>實質蛻變：</b><br>在這 33 次挑戰中，妳完成了 <span class="color-stat">${mealTotal} 次</span> 原型食物、<span class="color-stat">${drinkTotal} 次</span> 無糖飲品</p></div>`;
            } else if (baseCount === 66) {
                const mRate = Math.round((mealTotal / 66) * 100);
                const dRate = Math.round((drinkTotal / 66) * 100);
                mileArea.innerHTML = `<div class="milestone-report"><div class="milestone-tag" style="background:var(--p-yellow); color:#000;">MILESTONE 66</div><p style="margin:0; font-size:15px; line-height:1.8; color:#000;"><b>鋼鐵紀律：</b><br>達成率：原型食物 <span class="color-stat">${mRate}%</span> / 無糖飲品 <span class="color-stat">${dRate}%</span></p></div>`;
            }
            if(baseCount >= 100) document.getElementById('final-reveal-btn').style.display = 'block';
        }

        function saveData() {
            const now = new Date();
            const timeString = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            
            const state = {
                totalExp, baseCount, mealTotal, drinkTotal, bonusCount, todayMarked, hasBonusToday,
                mealDone: document.getElementById('task-meal').classList.contains('done'),
                drinkDone: document.getElementById('task-drink').classList.contains('done'),
                lastDate: new Date().toDateString(),
                saveTimestamp: timeString,
                cellClasses: Array.from(document.querySelectorAll('.cell')).map(c => c.className)
            };
            localStorage.setItem('c100_state', JSON.stringify(state));
            
            const timeEl = document.getElementById('last-time');
            if(timeEl) timeEl.innerText = timeString;
        }

        async function exportJSON() {
            const state = localStorage.getItem('c100_state');
            if(state) {
                const blindBoxCode = btoa(encodeURIComponent(state));
                await navigator.clipboard.writeText(blindBoxCode);
                alert("數據已封裝並複製！");
            }
        }

        function importJSON() {
            try {
                let content = document.getElementById('memoInput').value.trim();
                if (!content.startsWith('{')) {
                    try { content = decodeURIComponent(atob(content)); } catch (e) {
                        try { content = atob(content); } catch (e2) { throw new Error("解碼失敗，請確保代碼完整"); }
                    }
                }
                const d = JSON.parse(content);
                if(d.baseCount !== undefined) {
                    localStorage.setItem('c100_state', JSON.stringify(d));
                    alert("數據已成功歸位！頁面即將重整...");
                    location.reload();
                } else { alert("數據格式有誤，找不到進度資料。"); }
            } catch(e) { alert("匯入失敗：請確保貼上的代碼是完整的。"); console.error(e); }
        }

        function toggleRestoreZone() { const z = document.getElementById('restore-zone'); z.style.display = (z.style.display === 'block') ? 'none' : 'block'; }

        function applyCorrection(type) {
            if(type === 'A') {
                if(confirm("方案 A：確定要退回一格紀錄嗎？")) {
                    if(baseCount > 0) {
                        const lastCell = document.getElementById('c' + baseCount);
                        let expRefund = 10; 
                        
                        // 修正：依據新制「食4 飲6 Bonus10」精準退分
                        if(baseCount > 73) {
                            const mealWasDone = document.getElementById('task-meal').classList.contains('done');
                            const drinkWasDone = document.getElementById('task-drink').classList.contains('done');
                            if(mealWasDone && drinkWasDone) expRefund = 20;
                            else if(drinkWasDone) expRefund = 6;
                            else if(mealWasDone) expRefund = 4;
                        } else {
                            if(lastCell.classList.contains('gold-filled') && bonusCount > 0) bonusCount--;
                        }
                        
                        if(document.getElementById('task-meal').classList.contains('done') && mealTotal > 0) mealTotal--;
                        if(document.getElementById('task-drink').classList.contains('done') && drinkTotal > 0) drinkTotal--;

                        baseCount--;
                        const state = { 
                            totalExp: Math.max(0, totalExp - expRefund),
                            baseCount, mealTotal, drinkTotal, bonusCount, 
                            todayMarked: false, hasBonusToday: false, lastDate: "" 
                        };
                        localStorage.setItem('c100_state', JSON.stringify(state));
                        location.reload(); 
                    }
                }
            } else if(type === 'B') {
                if(confirm("方案 B：執行積分 8 折扣除？")) { totalExp -= 4; saveData(); alert("已扣除 4 分。"); }
            }
        }

        // 精準改寫：完美重現 建議 B (食4 飲6 Bonus10) 生存綁架計分邏輯
        function processTask(id) {
            const el = document.getElementById(id);
            if(el.classList.contains('done')) return;
            
            el.classList.add('done');
            
            const mealEl = document.getElementById('task-meal');
            const drinkEl = document.getElementById('task-drink');
            const isMealDone = mealEl.classList.contains('done');
            const isDrinkDone = drinkEl.classList.contains('done');
            
            // 判斷是否為第 74 天起的新規則
            const isNewRuleZone = (baseCount >= 73 || (baseCount === 72 && !todayMarked));
            
            if (!isNewRuleZone) {
                // 舊制配分
                totalExp += 10; 
                if (id === 'task-meal') mealTotal++;
                if (id === 'task-drink') drinkTotal++;
            } else {
                // 新制配分：精準對齊 4 / 6 / 10 綁架公式
                if (id === 'task-meal') {
                    mealTotal++;
                    if (isDrinkDone) {
                        // 本來無糖勾了(拿了6分)，現在補齊飲食(拿4分)，並解鎖無糖終極獎勵(+10分) = 補加 14 分
                        totalExp += 14; 
                        hasBonusToday = true;
                    } else {
                        // 孤零零只有控制飲食，只拿 4 分
                        totalExp += 4;
                    }
                } else if (id === 'task-drink') {
                    drinkTotal++;
                    if (isMealDone) {
                        // 本來飲食勾了(拿了4分)，現在補齊無糖(拿6分)，並解鎖無糖終極獎勵(+10分) = 補加 16 分
                        totalExp += 16;
                        hasBonusToday = true;
                    } else {
                        // 單純喝無糖，拿 6 分
                        totalExp += 6;
                    }
                }
            }
            
            if(!todayMarked && baseCount < 100) { 
                baseCount++; 
                todayMarked = true; 
            }
            
            if (isNewRuleZone && isMealDone && isDrinkDone) {
                const cell = document.getElementById('c' + baseCount);
                if (cell) cell.className = 'cell gold-filled';
            }
            
            saveData(); 
            updateUI();
        }

        function exportData() {
            const saved = localStorage.getItem('c100_state');
            if(saved) {
                const d = JSON.parse(saved);
                const percent = d.baseCount;
                const bar = "█".repeat(Math.floor(percent / 5)) + "░".repeat(20 - Math.floor(percent / 5));
                const report = `=== 挑戰進度 ===\n[${bar}] ${percent}%\n最後更新：${d.lastDate}\n===============`;
                document.getElementById('backup-text').value = report;
                document.getElementById('backup-overlay').style.display = 'flex';
            }
        }
        
        function openCertificate() {
            const now = new Date();
            const mm = String(now.getMonth() + 1).padStart(2, '0'), dd = String(now.getDate()).padStart(2, '0');
            const diffDays = Math.ceil(Math.abs(now - startDate) / (1000 * 60 * 60 * 24));
            const completionRate = Math.round(((baseCount) / 100) * 100);
            const baseCash = Math.round(totalExp * 1.6667);
            const bonus = (now <= deadline) ? 2000 : 0;
            document.getElementById('dynamic-text').innerHTML = `終於走到這裡了！<br>從 03/31 – <span class="color-date">${mm}/${dd}</span><br>在這 <span class="color-date">${diffDays}</span> 天裡，完成了 100 次挑戰！<br><br>克服了<b>無糖鮮奶茶</b>真的很不容易！<br><span class="color-ques">會想念有糖鮮奶茶的味道嗎？</span><br><br>妳完成度是：<span class="color-stat">${completionRate}%</span>。<br>總共得到 <span class="color-stat">${totalExp}</span> 積分。`;
            document.getElementById('res-base').innerText = baseCash.toLocaleString();
            document.getElementById('res-bonus').innerText = bonus.toLocaleString();
            document.getElementById('res-total').innerText = (baseCash + bonus).toLocaleString();
            document.getElementById('cert-overlay').style.display = 'flex';
            setTimeout(() => { document.getElementById('cert-box').style.opacity = '1'; }, 100);
        }
        function resetGame() { if(confirm("確定要【永久清空】所有紀錄嗎？")) { localStorage.clear(); location.reload(); } }
        function switchTab(id, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-'+id).classList.add('active'); el.classList.add('active');
        }
    </script>
</body>
</html>
